name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# cancel the old run if i push again on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validate data + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # starter says to use 3.12
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      # fails if someone edited the csvs (hash check) or the splits overlap
      - name: Validate release data
        run: python src/validate_data.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  smoke-train:
    name: Smoke training + quality gate
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      # smoke split + 60 trees so it only takes a few secs
      # only train/validation, never touch test
      - name: Train on smoke split
        run: python src/train.py --train data/smoke/train/train.csv --validation data/smoke/validation/validation.csv --model-dir artifacts/model --reports-dir artifacts/reports --trees 60

      - name: Quality gate (model must beat both baselines)
        run: python .github/scripts/quality_gate.py artifacts/reports/validation_metrics.json

      # save the model + metrics so they can be downloaded from the run
      - name: Upload metrics + model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-training-${{ github.sha }}
          path: artifacts/
          retention-days: 14

  docker:
    name: Build + run training container
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dockerfile is in aws/ but it copies from the root, so build from root with -f
      - name: Build image
        run: docker build -f aws/Dockerfile -t aerosecure-train:ci .

      # mount the data where sagemaker would put it (/opt/ml/...) and check we get a model out
      - name: Run container like SageMaker would
        run: |
          mkdir -p out/model out/data
          docker run --rm \
            -v "$PWD/data/smoke/train:/opt/ml/input/data/train:ro" \
            -v "$PWD/data/smoke/validation:/opt/ml/input/data/validation:ro" \
            -v "$PWD/out/model:/opt/ml/model" \
            -v "$PWD/out/data:/opt/ml/output/data" \
            aerosecure-train:ci --trees 30
          test -s out/model/model.joblib
          test -s out/data/validation_metrics.json
          echo "container worked, got model.joblib and validation_metrics.json"
